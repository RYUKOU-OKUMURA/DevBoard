# This project is managed via the Cloudflare Dashboard (UI).
# Intentionally leaving wrangler.toml without any active configuration to avoid
# managing resources and settings in this file.
#
# How to work locally without relying on wrangler.toml:
#   1) Build the static site (watch mode):
#        npm run build -- --watch
#   2) Run Cloudflare Pages local dev against the dist folder:
#        wrangler pages dev dist --kv=SESSIONS --port=8788
#
# Notes:
# - Bindings (e.g., KV, D1, R2) and environment variables should be configured
#   in the Cloudflare Dashboard (UI) under your Pages project settings.
# - This keeps deployment configuration centralized in the UI as requested.
