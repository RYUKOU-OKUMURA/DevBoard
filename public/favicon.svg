<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(12,18,24,0.18)"/>
    </filter>
  </defs>
  <!-- Crisp white tile -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="#ffffff" filter="url(#glow)"/>
  <!-- Kanban columns (light slate lines for contrast on white) -->
  <g fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="16" y="16" width="8" height="32" rx="2"/>
    <rect x="28" y="16" width="8" height="32" rx="2"/>
    <rect x="40" y="16" width="8" height="32" rx="2"/>
  </g>
  <!-- Accent cards -->
  <g stroke-linecap="round" stroke-width="4">
    <line x1="20" y1="24" x2="20" y2="24" stroke="#10b981"/>
    <line x1="32" y1="22" x2="32" y2="22" stroke="#f59e0b"/>
    <line x1="44" y1="28" x2="44" y2="28" stroke="#6366f1"/>
    <line x1="20" y1="32" x2="20" y2="32" stroke="#10b981"/>
    <line x1="32" y1="30" x2="32" y2="30" stroke="#f59e0b"/>
    <line x1="44" y1="36" x2="44" y2="36" stroke="#6366f1"/>
  </g>
</svg>
